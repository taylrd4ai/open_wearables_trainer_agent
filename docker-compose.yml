services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"  # OW postgres owns host 5432; trainer uses 5433
    environment:
      POSTGRES_USER: "${DB_USER:-openwearables}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-changeme_in_production}"
      POSTGRES_DB: "${DB_NAME:-ow_trainer}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-openwearables} -d ${DB_NAME:-ow_trainer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"  # OW API owns host 8000; trainer backend uses 8001
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${DB_USER:-openwearables}:${DB_PASSWORD:-changeme_in_production}@db:5432/${DB_NAME:-ow_trainer}"
    depends_on:
      db:
        condition: service_healthy
    # No alembic revisions exist yet; init_db() in app.main creates tables.
    # Restore `alembic upgrade head &&` here once backend/migrations/versions has real revisions.
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
